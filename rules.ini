; ============================================================
;  Правила на ICSI симулатора (еднакви за уеб и Python версията)
;  Отваря се с Notepad (Windows) или TextEdit (Mac).
;  Редовете, които започват с ; са обяснения и не се четат.
;  След промяна: запазете файла и пуснете програмата отново.
;  Уеб версията чете този файл, когато е качена на сървър
;  (напр. GitHub Pages или сървъра на клиниката) в същата папка;
;  отворена като файл тя ползва същите стойности, вградени в нея.
; ============================================================

[general]
; Лимит за един ооцит / един сперматозоид, в секунди (режим „Изпит“)
time_limit_s = 60
; С какъв режим тръгва менюто: exam = изпит, practice = упражнение
default_mode = exam
; След успешна проверка: след колко секунди започва следващото упражнение
auto_next_s = 3

[stage2]
; Етап 2 - сперматозоидът
; Скорост на плуване в PVP, µm/s
sperm_speed_min = 6
sperm_speed_max = 15
; Дял на сперматозоидите с нормална морфология (0 до 1); първите 4 винаги са нормални
normal_share = 0.6
; Дял на неподвижните (0 до 1)
immotile_share = 0.12
; Къде по опашката ударът обездвижва (0 = началото на опашката, 1 = краят ѝ)
immob_from = 0.15
immob_to = 0.85
; Колко навътре от върха трябва да е главата при проверката, µm
head_min_um = 5
head_max_um = 80

[stage3]
; Етап 3 - ооцитът
; Допуск за положението на полярното телце, в часове (0.5 ч = 15°)
orient_tol_h = 0.5
; Допуск за фокуса на полярното телце: градуси над или под фокусната равнина
tilt_tol_deg = 20
; Допуск за височината на holding пипетата спрямо екватора на ооцита, µm
equator_tol_um = 15
; От колко близо смукането привлича ооцита, µm
capture_um = 30
; Как се върти ооцитът:
;   pipette - с инжекционната пипета, като на живо: върхът докосва ооцита и го търкаля
;   button  - с режим „Върти“ и клавишите U/O, I/K, J/L (по-лесно, за начало)
;   both    - и двата начина
rotation = pipette
