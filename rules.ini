; ============================================================
;  Правила на ICSI симулатора (еднакви за уеб и Python версията)
;  Отваря се с Notepad (Windows) или TextEdit (Mac).
;  Редовете, които започват с ; са обяснения и не се четат.
;  След промяна: запазете файла и пуснете програмата отново.
;  Уеб версията чете този файл, когато е качена на сървър
;  (напр. GitHub Pages или сървъра на клиниката) в същата папка;
;  отворена като файл тя ползва същите стойности, вградени в нея.
; ============================================================

[general]
; Лимит за един ооцит / един сперматозоид, в секунди (режим „Изпит“) – за етапите без собствен time_limit_s
time_limit_s = 60
; С какъв режим тръгва менюто: exam = изпит, practice = упражнение
default_mode = exam
; Език по подразбиране (4.9): bg = български, en = English. Обучаемият може да го смени в менюто (изборът се запомня).
language = bg
; След успешна проверка: след колко секунди започва следващото упражнение
auto_next_s = 3

[focus]
; Фокус на микроскопа (етапи 2-5): Z / X или бутоните „Фокус ▼ / ▲“
; Скорост на фокуса, µm в секунда
speed_um_s = 40
; Колелото на мишката да върти фокуса (yes / no). Изключено, защото с Magic Mouse и тъчпад се задейства случайно.
wheel = no

[stage1]
; Етап 1 - преценка на ооцитите: колко често се появяват в капката (дял от 0 до 1)
; незрели (MI или GV)
immature_share = 0.2
; дегенерирани
degenerate_share = 0.08
; зрели (MII) без аномалия; останалите MII са с една аномалия (по статията: без аномалия 31%)
no_anomaly_share = 0.31
; колко ооцита за оценка по подразбиране (от 1 до 12); може да се смени и в менюто
oocytes = 10
; лимит за един ооцит, секунди (ако липсва – от [general])
time_limit_s = 60
; допуск за полярното телце на зрелите (MII) ооцити: на 12 или 6 часа ± толкова часа (0.5 ч = 15°)
orient_tol_h = 0.5

[stage2]
; Колко сперматозоида най-много може да засмуче обучаемият в иглата (1, 2 или 3).
; При 1 изборът не се показва в менюто и всичко е по един сперматозоид.
sperm_max = 1
; колко сперматозоида в капката по подразбиране (от 2 до 30); сменя се и в менюто
sperm = 14
; лимит за един сперматозоид, секунди (по лекаря: до 2 минути)
time_limit_s = 120
; Етап 2 - сперматозоидът
; Скорост на плуване в PVP, µm/s
sperm_speed_min = 6
sperm_speed_max = 15
; Дял на сперматозоидите с нормална морфология (0 до 1); първите 4 винаги са нормални
normal_share = 0.6
; Дял на неподвижните (0 до 1)
immotile_share = 0.12
; Къде по опашката се пречупва (0 = началото на опашката до главата, 1 = краят ѝ); 4.8: близо до главата
; по-близо от immob_from - сперматозоидът се поврежда; по-далеч от immob_to - опашката не се пречупва
immob_from = 0.05
immob_to = 0.35
; Обездвижване (4.8): опашката се притиска към дъното напречно и се пречупва с рязко движение на иглата назад
; колко рязко (µm/s), с какъв шанс се пречупва от един опит (0 до 1), най-малък ъгъл игла-опашка (градуси)
snap_speed_um_s = 35
snap_success = 0.75
min_angle_deg = 55
; дял на зашеметените: в иглата плуват към върха и трябва да се задържат със засмукване (0 до 1)
stunned_share = 0.2
; видове плуване: дял на бавните, на бързите и на плуващите в кръг (0 до 1)
slow_share = 0.15
fast_share = 0.15
circle_share = 0.08
; при ръба на капката се събират и го обхождат; колко често (1/s) се отделят от него
wall_leave = 0.015
; Колко навътре от върха трябва да е главата при проверката, µm
head_min_um = 5
head_max_um = 80

[stage3]
; Етап 3 - ооцитът
; Допуск за положението на полярното телце, в часове (0.5 ч = 15°)
orient_tol_h = 0.5
; Допуск за фокуса на полярното телце: градуси над или под фокусната равнина
tilt_tol_deg = 20
; Допуск за височината на holding пипетата спрямо екватора на ооцита, µm
equator_tol_um = 15
; От колко близо смукането привлича ооцита, µm
capture_um = 30
; Как се върти ооцитът:
;   pipette - с инжекционната пипета, като на живо: върхът докосва ооцита и го търкаля
;   button  - с режим „Върти“ и клавишите U/O, I/K, J/L (по-лесно, за начало)
;   both    - и двата начина
rotation = pipette
; Външен диаметър на holding пипетата (µm) - за мащаба на снимката ѝ в симулатора
holding_od_um = 120
; колко ооцита в капката по подразбиране (от 1 до 8); сменя се и в менюто
oocytes = 1
; лимит за един ооцит, секунди (по лекаря: намиране и хващане до 1 минута)
time_limit_s = 60

[stage4]
; Етап 4 - инжектирането
; Колко µm трябва да се вдлъбне zona, за да поддаде
zona_break_um = 10
; Колко µm засмукване трябва, за да се скъса мембраната (фунията)
membrane_break_um = 6
; Над колко µm засмукана цитоплазма ооцитът е увреден
lysis_um = 35
; Колко µm среда може да влезе в ооцита заедно със сперматозоида
medium_tol_um = 20
; Допуск за височината на иглата спрямо екватора при влизане, µm
height_tol_um = 10
; колко ооцита в серията по подразбиране (от 1 до 8); сменя се и в менюто
oocytes = 1
; лимит за един ооцит, секунди (по лекаря: инжектиране до 1 минута)
time_limit_s = 60

[stage5]
; Етап 5 - цялата процедура: тежест на всяка част в оценката на клетката (общо 100).
; Всяка част се оценява по своята таблица (етапи 2, 3 и 4), после се умножава по тежестта.
; Ако сборът не е 100, тежестите се преизчисляват пропорционално.
weight_sperm = 30
weight_oocyte = 30
weight_injection = 40
; колко ооцита и колко сперматозоида в PVP капката по подразбиране; сменят се и в менюто
oocytes = 1
sperm = 14
; лимит за един ооцит (цялата процедура), секунди (по лекаря: под 5 минути)
time_limit_s = 300

[scoring]
; Точки в режим „Изпит“. Всяка клетка / сперматозоид започва със start_points.
; Всяка грешка се отнема веднъж за клетката; неуспешната проверка - всеки път, до тавана (..._max).
; Изтекло време: 0 точки. Пише се колко се отнема (без минус).
start_points = 100
; Праг за издържан изпит (средно от всички клетки)
pass_score = 70

; Етап 2 - сперматозоидът (сумата е 100: 30 + 25 + 20 + 10 + 5 + 10)
sperm_bad_morphology = 30
sperm_immotile = 25
sperm_damaged = 20
sperm_head_first = 10
sperm_bottom_drag = 5
sperm_failed_check = 5
sperm_failed_check_max = 10
; иглата излезе от капката (етап 2)
sperm_out_of_drop = 10
; счупена игла от натиск в дъното (етапи 2 и 5)
sperm_needle_broken = 20
; Само в етап 5: сперматозоидът излезе от иглата при резко движение
sperm_lost = 30

; Етап 3 - ооцитът (сумата е 100: 35 + 35 + 10 + 20)
oocyte_pb_position = 35
oocyte_pb_focus = 35
oocyte_wrong_height = 10
oocyte_failed_check = 5
oocyte_failed_check_max = 20
; счупена инжекционна игла от натиск в дъното (етап 3)
oocyte_needle_broken = 10

; Етап 4 - инжектирането (сумата е 100: 25 + 25 + 20 + 15 + 5 + 5 + 5)
injection_opposite_membrane = 25
injection_damaged = 25
injection_no_breach = 20
injection_not_delivered = 15
injection_medium = 5
injection_inj_height = 5
injection_failed_check = 5
injection_failed_check_max = 5
; при няколко сперматозоида в иглата (етапи 4 и 5): два в един ооцит – клетката е 0; изгубен в средата
injection_two_sperm = 100
injection_spilled = 15

; Етап 1 - преценка на ооцитите (за всеки ооцит; оценката е от 100)
selection_immature_as_mii = 40
selection_mii_as_immature = 30
selection_wrong_maturity = 20
selection_missed_anomaly = 15
selection_false_anomaly = 10
; полярното телце на MII ооцита не е завъртяно на 12 или 6 часа
selection_pb_position = 15

[grades]
; Оценка според средните точки (от start_points): „от колко точки нагоре = оценка“.
; Имената и броят степени се сменят свободно (напр. A–F или само „Издържан“ / „Неиздържан“).
; Най-ниската оценка над тази от 0 точки трябва да съвпада с pass_score – иначе в менюто излиза ⚠.
95 = Отличен 6
87 = Много добър 5
79 = Добър 4
70 = Среден 3
0 = Слаб 2
